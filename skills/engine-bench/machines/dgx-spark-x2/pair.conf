# Network settings of the 2x DGX Spark pair, sourced by every script; set any of them in the environment to override.
# Defaults: spark-1ff6 (head: runs the scripts, llama-server, vLLM rank 0 and the client) and spark-d9ca (second node),
# joined by a direct ConnectX-7 cable on their second port: 10.10.30.1/.2 on enp1s0f1np1 (RoCE device rocep1s0f1) and
# 10.10.40.1/.2 on enP2p1s0f1np1 (roceP2p1s0f1), about 110 Gb/s each, same interface names on both nodes.
# The head must reach the second node by ssh over the link without a password prompt (BatchMode), and the bench folder,
# the models and the engine builds and venvs must be at the same absolute paths on both nodes.
export SELF=${SELF:-10.10.30.1}                   # head node address on the direct link
export PEER=${PEER:-10.10.30.2}                   # second node address on the direct link
export PEER_USER=${PEER_USER:-}                   # ssh user on the second node (empty: ~/.ssh/config or this user)
export NET_IF=${NET_IF:-enp1s0f1np1}              # NCCL and Gloo bootstrap interface (the SELF/PEER link)
export IB_HCA=${IB_HCA:-rocep1s0f1,roceP2p1s0f1}  # RoCE devices for the vLLM NCCL all-reduce
export RPC_PORT=${RPC_PORT:-50070}                # ggml-rpc-server port on both nodes
PEER_SSH=${PEER_USER:+$PEER_USER@}$PEER
peer() { ssh -o BatchMode=yes -o ConnectTimeout=20 $PEER_SSH "$@" < /dev/null; }
