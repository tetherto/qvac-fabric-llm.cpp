# Extra speculative flags per engine and mode. Measured once at setup (2026-10-21, setup/adaptive-*, four spec prompts,
# 512 tokens): --spec-draft-adaptive took strix-llama.cpp DFlash2 from 14.3 to 19.6 t/s and paoai DFlash2 from 23.2 to
# 26.0, but strix-llama.cpp MTP from 25.3 to 24.2, so it is on for DFlash2 only. Nathanw1014's fork has no such flag.
SPEC_EXTRA_STRIX_DFLASH2="--spec-draft-adaptive"
SPEC_EXTRA_STRIX_MTP=""
SPEC_EXTRA_PAOAI_DFLASH2="--spec-draft-adaptive"
SPEC_EXTRA_PAOAI_MTP=""
GUFO_SPEC_EXTRA=""
# paoai with --spec-draft-adaptive aborts on DFlash2 with 4 concurrent requests (dflash.cpp:418
# GGML_ASSERT(n_blocks > 0 && n_tokens % n_blocks == 0), 2026-10-21), so it runs fixed-length drafts there.
SPEC_EXTRA_PAOAI_DFLASH2_CONCSPEC=""
