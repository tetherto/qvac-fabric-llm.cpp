name: Server (sanitize)

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      sha:
        description: 'Commit SHA1 to build'
        required: false
        type: string
      slow_tests:
        description: 'Run slow tests'
        required: true
        type: boolean
  push:
    branches:
      - master
    paths: [
      '.github/workflows/server-sanitize.yml',
      '**/CMakeLists.txt',
      '**/Makefile',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      'tools/server/**.*'
    ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/server-sanitize.yml'
    ]

env:
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
  LLAMA_ARG_LOG_VERBOSITY: 10
  # QVAC-25533: fleet hosts are shared. With one thread per core, one descheduled thread stalls every graph node.
  LLAMA_ARG_THREADS: 4
  OMP_WAIT_POLICY: PASSIVE

# QVAC divergence from upstream. Reachable outcomes:
#
#   dispatch with `sha`             -> per (sha, slow_tests) (an identical
#                                      re-dispatch supersedes; a different
#                                      commit OR a different slow_tests
#                                      coexists)
#   push to master                  -> per run  (run_id; never cancels)
#   dispatch on another ref, no sha -> per ref   (supersedes)
#
# This workflow declares no `pull_request` trigger, so the first arm is inert
# here; it is kept so this block matches the other lanes.
#
# The dispatch arm keys on every input that changes what the run DOES.
# Bisecting a sanitizer regression means dispatching several commits, so
# without `sha` those would cancel each other; and without `slow_tests`, a
# quick re-dispatch of the same commit would kill an in-flight slow-test run.
# See QVAC-24627.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event.inputs.sha && format('{0}-slow{1}', github.event.inputs.sha, github.event.inputs.slow_tests)) || (github.ref == 'refs/heads/master' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  authorize:
    permissions: {}
    uses: ./.github/workflows/reusable-authorize-self-hosted.yml

  server:
    needs: [authorize, runner_names]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ${{ needs.runner_names.outputs.qvac_ubuntu2204_x64 }}

    strategy:
      matrix:
        sanitizer: [ADDRESS, UNDEFINED] # THREAD is very slow
        build_type: [RelWithDebInfo]
      fail-fast: false

    steps:
      #- name: Dependencies
      #  id: depends
      #  run: |
      #    sudo apt-get update
      #    sudo apt-get -y install \
      #      build-essential \
      #      xxd \
      #      git \
      #      cmake \
      #      curl \
      #      wget \
      #      language-pack-en \
      #      libssl-dev

      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Build
        id: cmake_build
        run: |
          cmake -B build \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DGGML_SCHED_NO_REALLOC=ON \
            -DGGML_SANITIZE_ADDRESS=${{ matrix.sanitizer == 'ADDRESS' }} \
            -DGGML_SANITIZE_THREAD=${{ matrix.sanitizer == 'THREAD' }} \
            -DGGML_SANITIZE_UNDEFINED=${{ matrix.sanitizer == 'UNDEFINED' }} \
            -DLLAMA_SANITIZE_ADDRESS=${{ matrix.sanitizer == 'ADDRESS' }} \
            -DLLAMA_SANITIZE_THREAD=${{ matrix.sanitizer == 'THREAD' }} \
            -DLLAMA_SANITIZE_UNDEFINED=${{ matrix.sanitizer == 'UNDEFINED' }}
          cmake --build build --config ${{ matrix.build_type }} -j $(nproc) --target llama-server

      - name: Python setup
        id: setup_python
        uses: actions/setup-python@v7

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/server/tests/requirements.txt

      # QVAC-24501: the harness binds a fixed 8080 unless PORT is set, and both
      # legs can land on one fleet host. Colliding legs either fail to bind or -
      # worse - one leg's tests drive the other leg's server and pass against a
      # binary built with the wrong sanitizer.
      - name: Pick a server port for this runner
        run: echo "PORT=$(.github/scripts/pick-server-port.sh)" >> "$GITHUB_ENV"

      - name: Tests
        id: server_integration_tests
        if: ${{ (!matrix.disabled_on_pr || !github.event.pull_request) }}
        run: |
          source .venv/bin/activate
          cd tools/server/tests
          export ${{ matrix.extra_args }}
          ./tests.sh

      - name: Slow tests
        id: server_integration_tests_slow
        if: ${{ (github.event.schedule || github.event.inputs.slow_tests == 'true') && matrix.build_type == 'Release' }}
        run: |
          source .venv/bin/activate
          cd tools/server/tests
          export ${{ matrix.extra_args }}
          SLOW_TESTS=1 ./tests.sh
