name: Runner names validate

# Enforces the runner-label catalog: the generated reusable workflow stays in
# sync with .github/runners.yaml, and no wired (QVAC-authored) workflow
# hardcodes a catalog qvac-* runner target. See .github/RUNNERS.md.

on:
  push:
    branches: [master]
    paths:
      - '.github/runners.yaml'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.github/runners.yaml'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

# QVAC divergence from upstream: dedupe per PR and per branch, so a re-push or
# re-dispatch supersedes the in-flight run. The default branch deliberately
# keeps upstream's run_id behaviour — master pushes must not cancel each other,
# or a merged commit can end with no CI verdict. See QVAC-24627. This file was
# deleted before that rollout, so it is brought in line here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate runner-name catalog (in sync + no hardcoded labels)
        run: node .github/scripts/validate-runner-names.mjs
      - name: Unit tests
        run: node --test .github/scripts/test/runner-names.test.mjs
