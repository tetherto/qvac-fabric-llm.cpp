name: Fork approval

# Privileged setter only: records qvac/fork-verified on the PR head SHA after
# fork-ci environment approval. pull_request_target loads this file from the
# default branch. Must never check out PR HEAD. Same-repo PRs skip the
# environment and skip the status write.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
