name: Convert PR to draft

on:
  # PR events also runs on labeled, so applying `draft` starts the default branch's copy, whose token can convert forks.
  workflow_run:
    workflows: [PR events]
    types: [requested]

cache-mode: none
permissions:
  pull-requests: write
  issues: write
  contents: write # required for "gh pr ready" command, see https://github.com/cli/cli/issues/8910

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  convert-to-draft:
    runs-on: ubuntu-slim
    steps:
      # The open, non-draft PRs labelled `draft` whose head is the triggering commit, from the API.
      - name: Find the pull requests
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          numbers=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f per_page=100 \
            -f head="${HEAD_REPO%%/*}:$HEAD_BRANCH" --jq '
              .[] | select(.head.sha == env.HEAD_SHA
                and (.head.repo.full_name | ascii_downcase) == (env.HEAD_REPO | ascii_downcase)
                and (.draft | not) and any(.labels[]; .name == "draft")) | .number' | xargs)
          [ -z "$numbers" ] || echo "PRs $numbers at $HEAD_SHA"
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

      - name: Convert the PRs to draft
        if: steps.pr.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ steps.pr.outputs.numbers }}
        run: |
          for pr in $PR_NUMBERS; do
            gh pr ready --undo "$pr" --repo "$GITHUB_REPOSITORY"
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label draft
          done
