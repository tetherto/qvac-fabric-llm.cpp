name: CI (self-hosted Metal backend)

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths: [
      '.github/workflows/ci-self-hosted-metal.yml',
      'ci/run.sh',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.swift',
      '**/*.m',
      '**/*.metal'
    ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/ci-self-hosted-metal.yml',
      'ci/run.sh',
      '**/CMakeLists.txt',
      '**/.cmake',
      'ggml/include/**',
      'src/**',
      'tests/**',
      'ggml/src/*',
      'ggml/src/ggml-cpu/**',
      'ggml/src/ggml-metal/**'
    ]

cache-mode: none
permissions:
  contents: read

# QVAC divergence from upstream: dedupe per PR and per branch, so a re-push or
# re-dispatch supersedes the in-flight run. The default branch deliberately
# keeps upstream's run_id behaviour - master pushes must not cancel each other,
# or a merged commit can end with no CI verdict. See QVAC-24627.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  # note: this is dud token to avoid rate limiting (https://github.com/ggml-org/llama.cpp/pull/25706#issuecomment-4979941302)
  HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  authorize:
    permissions: {}
    uses: ./.github/workflows/reusable-authorize-self-hosted.yml

  gpu-metal:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: qvac-macos26-arm64-gpu

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Test
        id: ggml-ci
        run: |
          git lfs install
          GG_BUILD_METAL=1 bash ./ci/run.sh ~/results/llama.cpp/$RUNNER_NAME ~/mnt/llama.cpp

      - name: Test SIGLU and masked attention independently
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test -x build-ci-debug/bin/test-backend-ops
          status=0
          for op in SIGLU FLASH_ATTN_EXT_MASKED_VALUES; do
            log="build-ci-debug/${op}.log"
            if build-ci-debug/bin/test-backend-ops -b MTL0 -o "$op" 2>&1 | tee "$log"; then
              grep -Eq '[1-9][0-9]*/[1-9][0-9]* tests passed' "$log" || status=1
            else
              status=1
            fi
          done
          exit "$status"

      - name: Preserve failing Metal fixtures and logs
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: metal-failure-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 0
          path: |
            build-ci-*/CMakeCache.txt
            build-ci-*/Testing/Temporary/*.log
            build-ci-*/*.log
            build-ci-*/tests/**/*.log
            build-ci-*/tests/test-models/*.gguf
