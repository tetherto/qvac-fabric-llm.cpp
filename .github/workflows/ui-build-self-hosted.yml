name: UI Build (self-hosted)

on:
  workflow_call:
    inputs:
      # QVAC-24501: taken from the caller rather than declared here. A reusable
      # workflow's own runner_names job is a second hosted job per run echoing
      # the same constants, and ui-self-hosted.yml already runs one.
      runs_on:
        description: "Runner label for the build job, from the caller's runner_names job"
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: tools/ui

      - name: Build application
        run: npm run build
        working-directory: tools/ui

      - name: Upload built UI
        uses: actions/upload-artifact@v6
        with:
          name: ui-build
          path: tools/ui/dist/
          retention-days: 1
