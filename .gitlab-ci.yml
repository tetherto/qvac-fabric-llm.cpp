workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: never

stages:
  - build-image
  - get-benchmark-configs
  - benchmark

variables:
  BENCH_CONFIGS_PATH: gitlab.collabora.com/ml/benchmark-configs.git
  BENCHMARK_CONFIG_BRANCH: main
  BENCH_MODELS_DIR: /bench-models
  GGML_VK_VISIBLE_DEVICES: 0
  GIT_CLEAN_FLAGS: -ffdx -e bench-workdir/wt -e bench-workdir/results
  NVIDIA_DRIVER_CAPABILITIES: "all"
  # bump when ci/gitlab/qvac-bench.Dockerfile or requirements-qvac-bench.txt change
  BENCH_IMAGE_TAG: "2026-10-06"
  BENCH_IMAGE: ${CI_REGISTRY_IMAGE}/qvac-bench-${TARGET}:${BENCH_IMAGE_TAG}
  OPTIONS: "--option ggml_vk_visible_devices:$GGML_VK_VISIBLE_DEVICES"

.build-image:
  stage: build-image
  image: quay.io/buildah/stable:latest
  tags:
    # this is the lightest container with privileged access
    - mediumweight
  variables:
    GIT_DEPTH: 1
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - test -n "$CI_REGISTRY_IMAGE" || { echo "CI_REGISTRY_IMAGE is empty, enable the container registry in project settings"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if buildah manifest inspect "$BENCH_IMAGE" > /dev/null; then
        echo "$BENCH_IMAGE already exists, skipping build"
        exit 0
      fi
    # push as a manifest list, manifest inspect does not accept single image manifests
    - >
      buildah build
      -f ci/gitlab/qvac-bench.Dockerfile
      --build-arg BASE_IMAGE="$BASE_IMAGE"
      --build-arg EXTRA_PACKAGES="$EXTRA_PACKAGES"
      --manifest "$BENCH_IMAGE"
      requirements/
    - buildah manifest push --all "$BENCH_IMAGE" "docker://$BENCH_IMAGE"

build-image-nvidia-job:
  extends: .build-image
  variables:
    TARGET: nvidia
    BASE_IMAGE: docker.io/nvidia/cuda:12.6.2-devel-ubuntu24.04
    EXTRA_PACKAGES: "libegl1 libglvnd0"

build-image-amd-job:
  extends: .build-image
  variables:
    TARGET: amd
    BASE_IMAGE: docker.io/ubuntu:24.04
    EXTRA_PACKAGES: "mesa-vulkan-drivers"

benchmark-configs-job:
  stage: get-benchmark-configs
  image: alpine:3.22
  before_script:
    - apk add --no-cache git
  script:
    - git clone -b ${BENCHMARK_CONFIG_BRANCH} https://gitlab-ci-token:${CI_JOB_TOKEN}@${BENCH_CONFIGS_PATH}
    - rm -rf benchmark-configs/.git
  artifacts:
    paths:
      - benchmark-configs/
    expire_in: 5 week

.benchmark:
  stage: benchmark
  image: $BENCH_IMAGE
  parallel:
    matrix:
      - BENCH_NAME:
        - llama-bench
        - llama-mtmd-cli
        BENCH_EXTRA_ARGS: "--warmup 2 --cooldown 30"
      - BENCH_NAME:
        - llama-finetune-lora
        BENCH_EXTRA_ARGS: "--option dataset:$CI_PROJECT_DIR/scripts/biomed-test.jsonl"
  before_script:
    # builds and results are cached across pipelines (GIT_CLEAN_FLAGS), drop both when the image changes
    - |
      if [ "$(cat bench-workdir/results/.image-tag 2>/dev/null)" != "$BENCH_IMAGE_TAG" ]; then
        rm -rf bench-workdir/results bench-workdir/wt/*/build-*
        mkdir -p bench-workdir/results
        echo "$BENCH_IMAGE_TAG" > bench-workdir/results/.image-tag
      fi
  script:
    - python scripts/qvac-bench.py --config benchmark-configs/"${BENCH_CONFIG_DIR:-$TARGET}"/"$BENCH_NAME".json --models-dir "$BENCH_MODELS_DIR" --retry-failed $OPTIONS $BENCH_EXTRA_ARGS
  artifacts:
    when: always
    paths:
      - ./bench-workdir/results
  timeout: 8h

benchmark-nvidia-vulkan-job:
  extends: .benchmark
  tags:
    - nvidia
  resource_group: nvidia
  variables:
    TARGET: nvidia
  needs:
    - job: build-image-nvidia-job
      artifacts: false
    - benchmark-configs-job

benchmark-nvidia-cuda-job:
  extends: benchmark-nvidia-vulkan-job
  variables:
    BENCH_CONFIG_DIR: nvidia/cuda
    OPTIONS: "--option cuda_visible_devices:0 --option ggml_cuda_enable_unified_memory:1"

benchmark-amd-vulkan-job:
  extends: .benchmark
  tags:
    - amd
  resource_group: amd
  variables:
    TARGET: amd
  needs:
    - job: build-image-amd-job
      artifacts: false
    - benchmark-configs-job

benchmark-s25-opencl-job:
  stage: benchmark
  tags:
    - s25
  resource_group: s25
  variables:
    TARGET: adreno
    BENCH_EXTRA_ARGS: "--warmup 2 --cooldown 30"
    BENCH_MODELS_DIR: /data/data/com.termux/files/home/bench-models
    OPTIONS: "--option ld_library_path:/system/vendor/lib64"
  needs:
    - benchmark-configs-job
  script:
    - python scripts/qvac-bench.py --config benchmark-configs/"${BENCH_CONFIG_DIR:-$TARGET}"/llama-bench-opencl.json --models-dir "$BENCH_MODELS_DIR" $OPTIONS $BENCH_EXTRA_ARGS
  artifacts:
    when: always
    paths:
      - ./bench-workdir/results
  dependencies:
    - benchmark-configs-job
  timeout: 8h
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

benchmark-pixel9-vulkan-job:
  stage: benchmark
  tags:
    - pixel9
  resource_group: pixel9
  variables:
    TARGET: pixel
    # os.cpu_count() is 1 under termux-chroot (no /sys), so set the build jobs explicitly
    BENCH_EXTRA_ARGS: "--warmup 2 --cooldown 30 --num-jobs 4"
    BENCH_MODELS_DIR: /data/data/com.termux/files/home/bench-models
  needs:
    - benchmark-configs-job
  script:
    - python scripts/qvac-bench.py --config benchmark-configs/"${BENCH_CONFIG_DIR:-$TARGET}"/llama-bench.json --models-dir "$BENCH_MODELS_DIR" $OPTIONS $BENCH_EXTRA_ARGS
  artifacts:
    when: always
    paths:
      - ./bench-workdir/results
  dependencies:
    - benchmark-configs-job
  timeout: 8h
