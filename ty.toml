[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests", "./scripts/snapdragon/qdc/tests"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
    "./scripts/snapdragon/qdc/**",
    "./tools/mtmd/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[[overrides]]
include = [
    "./examples/pydantic_models_to_grammar.py",
]

[overrides.rules]
unsupported-operator = "ignore"
not-subscriptable = "ignore"

# The exporter uses its separate, pinned Core ML environment.
[[overrides]]
include = [
    "./examples/embedding-coreml/export_coreml.py",
    "./examples/ffn-coreml/export_ffn.py",
    "./examples/ffn-coreml/export_sidecar.py",
    "./examples/ffn-coreml/palettize_ffn.py",
]

[overrides.rules]
unresolved-import = "ignore"
