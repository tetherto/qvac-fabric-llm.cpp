[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests", "./scripts/snapdragon/qdc/tests"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
    "./scripts/snapdragon/qdc/**",
    "./tools/mtmd/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[[overrides]]
include = [
    "./examples/pydantic_models_to_grammar.py",
]

[overrides.rules]
unsupported-operator = "ignore"
not-subscriptable = "ignore"

# The XDNA NPU kernel generators build IRON/MLIR-AIE designs. That toolchain
# (aie.*, pyxrt, ml_dtypes) is not pip-installable and is not in requirements,
# so its imports never resolve and every type behind them is Unknown.
[[overrides]]
include = [
    "./ggml/src/ggml-xdna/kernels/**",
]

[overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
