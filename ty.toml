[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests", "./scripts/snapdragon/qdc/tests"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
    "./skills/**",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
    "./scripts/snapdragon/qdc/**",
    "./tools/mtmd/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[[overrides]]
include = [
    "./examples/pydantic_models_to_grammar.py",
]

[overrides.rules]
unsupported-operator = "ignore"
not-subscriptable = "ignore"

# The exporter uses its separate, pinned Core ML environment. torch declares
# Module.forward as a Callable attribute, so ty >= 0.0.88 rejects method overrides.
[[overrides]]
include = [
    "./examples/embedding-coreml/export_coreml.py",
]

[overrides.rules]
unresolved-import = "ignore"
invalid-mutable-override = "ignore"
