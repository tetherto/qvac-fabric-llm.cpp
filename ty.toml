[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests", "./scripts/snapdragon/qdc/tests"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
    "./scripts/snapdragon/qdc/**",
    "./tools/mtmd/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
import-not-found = "ignore"
missing-attribute = "ignore"
missing-union-attribute = "ignore"

# These tools use the separate, pinned Core ML export environment.
[[overrides]]
include = [
    "./examples/embedding-coreml/expand_pack16.py",
    "./examples/embedding-coreml/export_coreml.py",
    "./examples/embedding-coreml/palettize_pack.py",
]

[overrides.rules]
import-not-found = "ignore"
